<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3b2a" />
  <title>Envio de Currículo | Metro Cúbico Service</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header id="header" class="scrolled">
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Metro Cúbico Service">
        <img src="Metro Cubico.png" alt="Logo Metro Cúbico" class="brand-logo" />
        <div class="brand-text"><strong>Metro Cúbico</strong><small>Service</small></div>
      </a>
      <div class="nav-actions">
        <a class="btn btn-outline" href="index.html">Voltar para o menu principal</a>
      </div>
    </div>
  </header>

  <main>
    <section class="contact" style="padding-top: 140px; min-height: 100vh;">
      <div class="container contact-grid">
        <div style="position: sticky; top: 100px;">
          <aside class="contact-info" style="position: static;">
            <h3>Trabalhe Conosco</h3>
            <p>Faça parte de uma equipe focada em qualidade, segurança e excelência. Preencha os dados e anexe seu currículo atualizado em formato PDF ou DOC.</p>
          </aside>
          <div style="margin-top: 24px;">
            <a class="btn" href="index.html" style="width: 100%; padding: 18px; font-size: 16px; background: var(--cream-2); color: var(--green-900); border: 1px solid var(--line);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
              Voltar para o menu principal
            </a>
          </div>
        </div>
        
        <form class="form" data-form="curriculo">
          <div class="field">
            <label for="nome">Nome Completo</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome completo" required />
          </div>
          <div class="form-row">
            <div class="field">
              <label for="telefone">Telefone / WhatsApp</label>
              <input id="telefone" name="telefone" type="tel" placeholder="(47) 9 0000-0000" required />
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" placeholder="seu@email.com" required />
            </div>
          </div>
          <div class="field">
            <label for="arquivo">Anexar Currículo</label>
            <input id="arquivo" name="arquivo" type="file" accept=".pdf,.doc,.docx" required />
          </div>
        <div style="display: flex; gap: 14px; flex-wrap: wrap;">
          <button class="btn btn-primary" type="submit">Enviar Currículo</button>
        </div>
        </form>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-lib.js"></script>
  <script src="supabase.js"></script>
  <script src="java.js"></script>
</body>
</html>
